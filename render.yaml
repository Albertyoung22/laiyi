services:
  - type: web
    name: laiyi-precision-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        value: laiyi888
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.3
      - key: GITHUB_BACKUP_BRANCH
        value: cloud-backup
